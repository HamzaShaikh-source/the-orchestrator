<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Orchestrator – Multi-Agent AI</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface-2: #23222e;
    --surface-3: #2c2b38;
    --line: #2e2d3a;
    --text: #ededf0;
    --text-secondary: #a1a1b0;
    --brand: #10a37f;
    --brand-light: #1a7f64;
    --accent: #4285f4;
    --danger: #f44250;
    --warning: #f5a623;
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 20px;
    --shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .app { display: flex; height: 100vh; }
  
  /* Sidebar */
  .sidebar {
    width: 280px; background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    backdrop-filter: blur(10px);
  }
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--line); }
  .sidebar-header h1 {
    font-size: 20px; font-weight: 600;
    background: linear-gradient(135deg, var(--brand), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .new-chat-btn {
    width: 100%; margin-top: 12px; padding: 10px;
    border-radius: var(--radius);
    background: rgba(16,163,127,0.15);
    border: 1px solid var(--brand);
    color: var(--brand); font-weight: 500; cursor: pointer;
    transition: all 0.2s;
  }
  .new-chat-btn:hover { background: rgba(16,163,127,0.25); transform: translateY(-1px); }
  .chat-list { flex: 1; overflow-y: auto; padding: 12px; }
  .chat-item {
    padding: 12px; border-radius: var(--radius-sm); margin-bottom: 6px;
    cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
  }
  .chat-item:hover { background: var(--surface-2); border-color: var(--line); }
  .chat-item.active { background: var(--surface-3); border-color: var(--brand); }
  .chat-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-meta { font-size: 10px; color: var(--text-secondary); margin-top: 4px; display: flex; justify-content: space-between; }
  
  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Agent strip */
  .agent-strip {
    display: flex; gap: 8px; padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(26,26,36,0.7); backdrop-filter: blur(8px);
  }
  .agent-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 40px;
    background: var(--surface-2); border: 1px solid var(--line);
    cursor: pointer; transition: all 0.2s; font-size: 13px;
  }
  .agent-chip.selected { background: rgba(16,163,127,0.2); border-color: var(--brand); }
  .agent-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .agent-chip .dot.working { background: var(--warning); animation: pulse 1s infinite; }
  .agent-chip .dot.done { background: var(--brand); }
  
  /* Input area */
  .input-area { padding: 20px; border-bottom: 1px solid var(--line); }
  .goal-input {
    width: 100%; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; color: var(--text); font-family: inherit; font-size: 14px;
    resize: vertical; outline: none; transition: all 0.2s;
  }
  .goal-input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(16,163,127,0.2); }
  .action-bar { display: flex; justify-content: space-between; margin-top: 12px; gap: 12px; }
  .run-btn {
    background: var(--brand); border: none; padding: 10px 20px;
    border-radius: 40px; font-weight: 600; color: white; cursor: pointer;
    transition: all 0.2s;
  }
  .run-btn:hover { background: var(--brand-light); transform: scale(1.02); }
  .stop-btn {
    background: rgba(244,66,80,0.15); border: 1px solid var(--danger);
    color: var(--danger); padding: 10px 20px; border-radius: 40px; cursor: pointer;
  }
  .file-attach { display: flex; align-items: center; gap: 12px; }
  .file-label {
    background: var(--surface-3); padding: 8px 16px; border-radius: 40px;
    cursor: pointer; font-size: 12px;
  }
  
  /* Status */
  .status-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; background: var(--surface);
    font-size: 12px; color: var(--text-secondary);
  }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
  .status-dot.working { background: var(--warning); animation: pulse 1s infinite; }
  .status-dot.done { background: var(--brand); }
  .status-dot.error { background: var(--danger); }
  
  /* Content */
  .content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 24px; }
  .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 12px; }
  .task-card, .output-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; transition: all 0.2s;
  }
  .task-card:hover { border-color: var(--brand); }
  .task-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .task-status { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--surface-3); }
  .task-status.done { background: rgba(16,163,127,0.2); color: var(--brand); }
  .task-status.error { background: rgba(244,66,80,0.2); color: var(--danger); }
  .output-card .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 500; }
  .output-card .body { white-space: pre-wrap; font-size: 13px; line-height: 1.5; max-height: 300px; overflow-y: auto; }
  .synthesis-card {
    background: linear-gradient(135deg, var(--surface-2), var(--surface));
    border: 1px solid var(--brand); border-radius: var(--radius); padding: 20px;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  #confirm-bar { display: none; gap: 12px; margin-top: 16px; }
  .hidden { display: none !important; }
  
  @media (max-width: 700px) { .sidebar { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>The Orchestrator</h1>
      <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
    </div>
    <div class="chat-list" id="chat-list"></div>
  </aside>
  <div class="main">
    <div class="agent-strip" id="agent-strip"></div>
    <div class="input-area">
      <textarea class="goal-input" id="goal-input" rows="3" placeholder="What do you want to build? Example: 'Create a personal finance dashboard with charts and dark mode'"></textarea>
      <div class="action-bar">
        <div class="file-attach">
          <label class="file-label">📎 Attach files <input type="file" id="file-upload" multiple style="display:none"></label>
          <span id="file-count" style="font-size:12px;color:var(--text-secondary)"></span>
        </div>
        <div>
          <button class="run-btn" id="run-btn">▶ Run</button>
          <button class="stop-btn hidden" id="stop-btn">■ Stop</button>
        </div>
      </div>
    </div>
    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>
    <div class="content" id="content">
      <div id="tasks-section" class="hidden">
        <div class="section-title">Task Breakdown</div>
        <div id="task-list"></div>
        <div id="confirm-bar">
          <button id="confirm-tasks" class="run-btn">Confirm & Run</button>
          <button id="cancel-tasks" class="stop-btn">Cancel</button>
        </div>
      </div>
      <div id="outputs-section" class="hidden">
        <div class="section-title">Agent Outputs</div>
        <div id="outputs-list"></div>
      </div>
      <div id="synth-section" class="hidden">
        <div class="section-title">Final Synthesis</div>
        <div class="synthesis-card" id="synth-body"></div>
        <button id="export-btn" style="margin-top:12px; background:transparent; border:1px solid var(--brand); border-radius:40px; padding:8px 16px; color:var(--brand); cursor:pointer;">📄 Export Markdown</button>
      </div>
    </div>
  </div>
</div>
<script src="agents.js"></script>
<script src="multi-agent.js"></script>
</body>
</html>
