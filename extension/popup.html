<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Orchestrator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="title">The Orchestrator</div>
    <span id="status-pill" class="pill pill-gray"><span class="dot"></span><span id="status-pill-text">Checking…</span></span>
  </header>

  <section class="panel" id="providers">
    <div class="row">
      <span class="provider-name">ChatGPT</span>
      <span class="status" id="status-chatgpt">…</span>
    </div>
    <div class="row">
      <span class="provider-name">Gemini</span>
      <span class="status" id="status-gemini">…</span>
    </div>
    <div class="row">
      <span class="provider-name">Perplexity</span>
      <span class="status" id="status-perplexity">…</span>
    </div>
  </section>

  <div class="actions">
    <button id="dashboard-btn" class="btn btn-accent">Open dashboard</button>
  </div>

  <p class="note">Runs entirely in this browser using your logged-in sessions. No server, no API keys.</p>

  <script src="popup.js"></script>
</body>
</html>
