<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Orchestrator – Multi-Agent AI Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Light mode (default) */
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.65);
      --bg-glass-solid: rgba(255, 255, 255, 0.92);
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-glow: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #10a37f;
      --accent-light: #e6f7f2;
      --accent-glow: rgba(16, 163, 127, 0.2);
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.12);
      --radius-sm: 12px;
      --radius: 20px;
      --radius-lg: 32px;
      --transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    body.dark {
      --bg-primary: #0a0c10;
      --bg-secondary: #111418;
      --bg-glass: rgba(17, 20, 24, 0.7);
      --bg-glass-solid: rgba(17, 20, 24, 0.95);
      --surface: #1a1e24;
      --surface-hover: #252b33;
      --border: #2a2f38;
      --border-glow: #3a3f4a;
      --text: #edf2f7;
      --text-secondary: #a0aec0;
      --text-muted: #718096;
      --accent-light: #1a2a2a;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      transition: var(--transition);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .app { display: flex; height: 100vh; backdrop-filter: blur(2px); }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 300px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      z-index: 10;
    }

    .sidebar-header {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .logo p { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }

    .new-chat-btn {
      background: var(--accent);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .new-chat-btn:hover {
      transform: scale(1.05) rotate(90deg);
      background: #0d8c6e;
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .new-chat-btn svg { width: 22px; height: 22px; stroke: white; stroke-width: 2; }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .chat-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, var(--accent-glow), transparent 80%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .chat-item:hover { transform: translateX(4px); border-color: var(--accent); background: var(--surface-hover); }
    .chat-item:hover::after { opacity: 0.5; }
    .chat-item.active { border-left: 4px solid var(--accent); background: var(--surface-hover); box-shadow: var(--shadow-sm); }
    .chat-title { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.7rem; color: var(--text-muted); }

    /* ===== MAIN ===== */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-secondary); }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      padding: 16px 24px;
      gap: 12px;
      background: var(--bg-glass-solid);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: 8px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      transition: var(--transition);
    }
    .theme-toggle:hover { transform: scale(1.02); border-color: var(--accent); box-shadow: var(--shadow-sm); }

    .agent-strip {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
    }
    .agent-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 60px;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
    }
    .agent-chip:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow-md); }
    .agent-chip.selected { background: var(--accent-light); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .agent-chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); transition: 0.2s; }
    .agent-chip .dot.working { background: var(--warning); animation: pulse 1.2s infinite; }
    .agent-chip .dot.done { background: var(--accent); }
    .agent-chip .dot.error { background: var(--danger); }

    .input-section {
      padding: 24px 28px;
      background: var(--bg-glass-solid);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .goal-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      resize: vertical;
      transition: var(--transition);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.02), var(--shadow-sm);
    }
    .goal-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-md); }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .file-attach {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      padding: 8px 18px;
      border-radius: 60px;
      border: 1px solid var(--border);
      transition: var(--transition);
    }
    .file-attach:hover { border-color: var(--accent); transform: translateY(-2px); }
    .file-label { cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 500; }
    #file-count { font-size: 0.75rem; color: var(--accent); }
    .btn-group { display: flex; gap: 12px; }
    .run-btn {
      background: linear-gradient(135deg, var(--accent), #0d8c6e);
      border: none;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 12px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .run-btn:hover { transform: scale(1.02) translateY(-2px); box-shadow: 0 12px 24px var(--accent-glow); }
    .stop-btn {
      background: rgba(239,68,68,0.1);
      border: 1px solid var(--danger);
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 600;
      color: var(--danger);
      cursor: pointer;
      transition: var(--transition);
    }
    .stop-btn:hover { background: rgba(239,68,68,0.2); transform: scale(1.02); }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 28px;
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
    }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text-muted); transition: 0.2s; }
    .status-dot.working { background: var(--warning); animation: pulse 1s infinite; box-shadow: 0 0 6px var(--warning); }
    .status-dot.done { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .status-dot.error { background: var(--danger); }
    @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.95); box-shadow: 0 0 0 0 var(--accent-glow); } 50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 12px 4px var(--accent-glow); } 100% { opacity: 0.6; transform: scale(0.95); box-shadow: 0 0 0 0 var(--accent-glow); } }

    .content { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 32px; }
    .section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 16px; }
    .task-card, .output-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: var(--transition);
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .task-card:hover, .output-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-md); }
    .task-header { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; }
    .task-status { font-size: 0.7rem; padding: 4px 12px; border-radius: 60px; font-weight: 600; }
    .task-status.done { background: rgba(16,163,127,0.15); color: var(--accent); }
    .task-status.error { background: rgba(239,68,68,0.15); color: var(--danger); }
    .task-status.in-progress { background: rgba(245,158,11,0.15); color: var(--warning); animation: pulse 1s infinite; }

    .output-card .header { display: flex; align-items: center; gap: 12px; font-weight: 600; margin-bottom: 12px; }
    .output-card .body { font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; max-height: 300px; overflow-y: auto; background: var(--bg-primary); padding: 12px; border-radius: var(--radius-sm); }
    .copy-output { margin-top: 12px; background: transparent; border: 1px solid var(--border); border-radius: 40px; padding: 6px 16px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
    .copy-output:hover { border-color: var(--accent); background: var(--accent-light); }

    .synthesis-card { background: linear-gradient(145deg, var(--surface), var(--bg-glass)); border: 1px solid var(--accent); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-lg); }
    #confirm-bar { gap: 16px; margin-top: 20px; justify-content: flex-end; }

    /* ── Task Tiles (grid) ── */
    .task-tile {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; transition: var(--transition);
      display: flex; gap: 12px;
    }
    .task-tile:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
    .tile-num { font-size: 1.1rem; font-weight: 700; color: var(--accent); flex: 0 0 28px; }
    .tile-body { flex: 1; }
    .tile-status { font-size: 0.65rem; padding: 2px 10px; border-radius: 40px; display: inline-block; margin-bottom: 6px; font-weight: 600; }
    .tile-status.done { background: rgba(16,163,127,0.15); color: var(--accent); }
    .tile-status.error { background: rgba(239,68,68,0.15); color: var(--danger); }
    .tile-status.in-progress { background: rgba(245,158,11,0.15); color: var(--warning); }
    .tile-desc { font-size: 0.8rem; line-height: 1.5; }
    .tile-agent { font-size: 0.7rem; color: var(--text-secondary); margin-top: 6px; }
    .tile-edit { width:100%; background:var(--surface-hover); border:1px solid var(--border); border-radius:8px; padding:8px; color:var(--text); font-family:inherit; font-size:0.8rem; }
    #task-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }

    /* ── Outputs summary ── */
    .outputs-summary {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.8rem;
    }

    .toast {
      position: fixed; bottom: 30px; right: 30px;
      background: var(--bg-glass-solid); backdrop-filter: blur(12px);
      border-left: 4px solid var(--accent);
      padding: 12px 20px; border-radius: 60px; font-size: 0.8rem;
      z-index: 9999; animation: slideIn 0.3s ease; box-shadow: var(--shadow-lg);
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .action-row { flex-direction: column; align-items: stretch; }
      .btn-group { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <h1>The Orchestrator</h1>
        <p>multi‑agent studio</p>
      </div>
      <button class="new-chat-btn" id="new-chat-btn" aria-label="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </div>
    <div class="chat-list" id="chat-list"></div>
  </aside>

  <div class="main">
    <div class="top-bar">
      <button class="theme-toggle" id="theme-toggle"><span id="theme-icon">🌙</span> <span>Dark / Light</span></button>
    </div>

    <div class="agent-strip" id="agent-strip"></div>

    <div class="input-section">
      <textarea class="goal-input" id="goal-input" rows="2" placeholder="Describe your goal… e.g., 'Create a full-stack expense tracker with charts and export to PDF'"></textarea>
      <div class="action-row">
        <div class="file-attach">
          <label class="file-label">📎 Attach Files <input type="file" id="file-upload" multiple style="display:none"></label>
          <span id="file-count">0 attached</span>
        </div>
        <div class="btn-group">
          <button class="run-btn" id="run-btn"><span>▶</span> Run Pipeline</button>
          <button class="stop-btn hidden" id="stop-btn">■ Stop</button>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>

    <div class="content">
      <div id="tasks-section" class="hidden">
        <div class="section-title">Task Breakdown</div>
        <div id="task-list"></div>
        <div id="confirm-bar">
          <button class="stop-btn" id="cancel-tasks">Cancel</button>
          <button class="run-btn" id="confirm-tasks">✓ Confirm & Run</button>
        </div>
      </div>
      <div id="outputs-section" class="hidden">
        <div class="section-title">Agent Outputs</div>
        <div id="outputs-list"></div>
      </div>
      <div id="synth-section" class="hidden">
        <div class="section-title">Final Synthesis</div>
        <div class="synthesis-card" id="synth-body"></div>
        <button id="export-btn" style="margin-top:20px;background:var(--accent);border:none;border-radius:40px;padding:10px 24px;color:white;font-weight:600;cursor:pointer;transition:0.2s">📄 Export Markdown</button>
      </div>
    </div>
  </div>
</div>

<script src="../src/agents.js"></script>
<script src="multi-agent.js"></script>
</body>
</html>
